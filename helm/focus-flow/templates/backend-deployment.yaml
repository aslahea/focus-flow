apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
        ports:
        - containerPort: {{ .Values.backend.port }}
        {{- with .Values.backend.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 8 }}
        {{- else }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.backend.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        {{- end }}
        {{- with .Values.backend.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 8 }}
        {{- else }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.backend.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        {{- end }}
        {{- with .Values.backend.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: TASK_READ_URL
          value: "http://task-read:3001"
        - name: TASK_WRITE_URL
          value: "http://task-write:3002"
        {{- if .Values.backend.frontendOrigin }}
        - name: FRONTEND_ORIGIN
          value: "{{ .Values.backend.frontendOrigin }}"
        {{- end }}
