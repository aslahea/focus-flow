namespace: focus-flow

service:
  port: 3000

ingress:
  enabled: false

httpRoute:
  enabled: false

frontend:
  image:
    repository: aslahea/focus-flow-frontend
    tag: "latest"
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

backend:
  image:
    repository: aslahea/focus-flow-backend
    tag: "latest"
  port: 5000
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  frontendOrigin: "http://localhost:3000"

taskRead:
  image:
    repository: aslahea/focus-flow-task-read
    tag: "latest"
  port: 3001
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "128Mi"

taskWrite:
  image:
    repository: aslahea/focus-flow-task-write
    tag: "latest"
  port: 3002
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "128Mi"

serviceAccount:
  create: false
