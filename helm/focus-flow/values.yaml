namespace: focus-flow

# Chart-level service defaults used by networking templates
service:
  port: 3000

# Ingress configuration (disabled by default; enable explicitly)
ingress:
  enabled: false
  className: ""
  annotations: {}
  tls: []
  hosts: []

# Gateway API HTTPRoute configuration (disabled by default; enable explicitly)
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  annotations: {}
  rules: []

frontend:
  image:
    repository: aslahea/focus-flow-frontend
    tag: "latest"   # overridden by CI/CD
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

backend:
  image:
    repository: aslahea/focus-flow-backend
    tag: "latest"   # overridden by CI/CD
  port: 5000
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  # Optional: explicit frontend origin the backend should allow
  frontendOrigin: "http://localhost:3000"

taskRead:
  image:
    repository: aslahea/focus-flow-task-read
    tag: "latest"   # overridden by CI/CD
  port: 3001
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "128Mi"

taskWrite:
  image:
    repository: aslahea/focus-flow-task-write
    tag: "latest"   # overridden by CI/CD
  port: 3002
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "128Mi"

serviceAccount:
  create: false
  name: ""
  automount: false
  annotations: {}
