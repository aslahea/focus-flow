namespace: focus-flow

# Chart-level service defaults used by networking templates
service:
  port: 3000

# Ingress configuration (disabled by default; enable explicitly)
ingress:
  enabled: false
  className: ""
  annotations: {}
  tls: []
  hosts: []

# Gateway API HTTPRoute configuration (disabled by default; enable explicitly)
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  annotations: {}
  rules: []

frontend:
  image: aslahea/focus-flow-frontend
  tag: "1.0"
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

backend:
  image: aslahea/focus-flow-backend
  tag: "1.0"
  port: 5000
  # Backend autoscaling and resources (production-ready defaults)
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

taskRead:
  image: aslahea/focus-flow-task-read
  tag: "1.0"
  port: 3001
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "128Mi"

taskWrite:
  image: aslahea/focus-flow-task-write
  tag: "1.0"
  port: 3002
  # Persistence for task-write service (production required)
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "128Mi"

serviceAccount:
  create: false
  name: ""
  automount: false
  annotations: {}
