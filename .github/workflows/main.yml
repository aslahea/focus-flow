name: DevSecOps Master Orchestrator

on:
  workflow_call:
    inputs:
      language:
        type: string
        default: 'javascript'
      target-url:
        type: string
        default: 'https://example.com'
      email-recipient:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      language:
        description: 'CodeQL Target Language'
        required: true
        default: 'javascript'
      target-url:
        description: 'OWASP ZAP Scan Target URL'
        required: true
        default: 'https://example.com'
      email-recipient:
        description: 'Send test email to:'
        required: true
        default: 'aslahea068@gmail.com'

jobs:
  # 1. CodeQL SAST Scan
  sast-codeql:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: aslahea/zero-friction-devsecops/.github/workflows/codeql.yml@main
    with:
      language: ${{ github.event.inputs.language || inputs.language }}

  # 2. SonarCloud Code Quality Scan
  sast-sonar:
    uses: aslahea/zero-friction-devsecops/.github/workflows/sonarqube.yml@main
    secrets: inherit

  # 3. Trivy SCA Scan
  sca-trivy:
    uses: aslahea/zero-friction-devsecops/.github/workflows/trivy-fs.yml@main

  # 4. OWASP ZAP DAST Scan
  dast-zap:
    uses: aslahea/zero-friction-devsecops/.github/workflows/zap.yml@main
    with:
      target-url: ${{ github.event.inputs.target-url || inputs.target-url }}

  # 5. Aggregator & Notifier
  notify:
    needs: [sast-codeql, sast-sonar, sca-trivy, dast-zap]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trivy-report
          path: reports/

      - name: Download ZAP Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zap-report
          path: reports/

      # Dynamic API Call: Generates a custom SonarQube text report on-the-fly
      - name: Generate SonarQube Text Report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ secrets.SONAR_ORGANIZATION || github.repository_owner }}_${{ github.event.repository.name }}
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          echo "Polling SonarCloud API for final analysis..."
          sleep 10 # Short buffer to allow SonarCloud to finish processing
          
          curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" > sonar-raw.json
          
          if jq -e .projectStatus sonar-raw.json >/dev/null; then
            STATUS=$(jq -r '.projectStatus.status' sonar-raw.json)
            echo "=========================================" > reports/sonar-report.txt
            echo "      SONARCLOUD QUALITY GATE REPORT     " >> reports/sonar-report.txt
            echo "=========================================" >> reports/sonar-report.txt
            echo "Project Key: ${PROJECT_KEY}" >> reports/sonar-report.txt
            echo "Quality Gate Status: ${STATUS}" >> reports/sonar-report.txt
            echo "-----------------------------------------" >> reports/sonar-report.txt
            echo "Detailed Quality Gate Conditions:" >> reports/sonar-report.txt
            jq -r '.projectStatus.conditions[] | "Metric: \(.metricKey) | Status: \(.status) | Value: \(.actualValue) (Threshold: \(.errorThreshold || "N/A"))"' sonar-raw.json >> reports/sonar-report.txt
            echo "=========================================" >> reports/sonar-report.txt
            echo "View Full Dashboard: https://sonarcloud.io/dashboard?id=${PROJECT_KEY}" >> reports/sonar-report.txt
          else
            echo "Failed to retrieve SonarCloud metrics. Project may not be analyzed yet." > reports/sonar-report.txt
          fi

      # Send Email Report (including our new sonar-report.txt)
      - name: Send Email Report
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        if: ${{ env.MAIL_SERVER != '' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[DevSecOps Alert] Pipeline Security Reports for ${{ github.repository }}"
          to: ${{ github.event.inputs.email-recipient || inputs.email-recipient }}
          from: "DevSecOps Engine <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Hello Team,

            The centralized security scanning pipeline has completed execution for: ${{ github.repository }} (Branch: ${{ github.ref_name }}).

            Summary of Scans:
            1. SAST (CodeQL): Completed. Findings are visual and available on your GitHub dashboard under "Security > Code scanning".
            2. SAST (SonarCloud): Quality Gate Analysis completed. Detailed metrics are attached as 'sonar-report.txt'.
            3. SCA (Trivy): Completed. (Trivy text report is attached).
            4. DAST (OWASP ZAP): Completed. (ZAP HTML report is attached).

            Please find the reports attached to this email.

            Regards,
            DevSecOps Governance Engine
          attachments: reports/*

      # Fallback notice if SMTP secrets are missing in the app repo
      - name: Log Notice (SMTP Not Configured in Caller Repository)
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        if: ${{ env.MAIL_SERVER == '' }}
        run: |
          echo "========================================================="
          echo "   SMTP credentials not configured in this repository.   "
          echo "   Skipping email transmission to protect workflow runtime. "
          echo "========================================================="
