trigger:
  - main

variables:
- group: dockerhub-secrets
- name: tag
  value: $(Build.BuildId)
- name: dockerHubUsername
  value: aslahea
- name: imageRepoFrontend
  value: focus-flow-frontend
- name: imageRepoBackend
  value: focus-flow-backend
- name: imageRepoTaskRead
  value: focus-flow-task-read
- name: imageRepoTaskWrite
  value: focus-flow-task-write

pool:
  name: 'FocusFlowPool' 

stages:

# -----------------------------------------------------------
# STAGE 1: Build & Validate (Linting)
# -----------------------------------------------------------
- stage: Build
  displayName: 'Lint & Validate'
  jobs:
  - job: Validate
    steps:
    - checkout: self
    - bash: |
        echo "Running Helm lint..."
        helm lint helm/focus-flow
      displayName: 'Helm Lint Check'

# -----------------------------------------------------------
# STAGE 2: Docker Build & Push (Includes Artifacts Auth)
# -----------------------------------------------------------
- stage: Docker
  displayName: 'Docker Build & Push'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: BuildImages
    steps:
    - checkout: self

    # NEW: Authenticate with Azure Artifacts NPM Feed
    # This allows 'npm install' to work inside your Docker builds if you use private packages
    - task: npmAuthenticate@0
      displayName: 'Authenticate with Azure Artifacts'
      inputs:
        workingFile: .npmrc # Ensure you have an .npmrc file in your project root

    - bash: |
        echo $(DOCKERHUB_PASSWORD) | docker login -u $(dockerHubUsername) --password-stdin
      displayName: 'Docker Hub Login'

    - bash: |
        # Frontend
        docker build -t $(dockerHubUsername)/$(imageRepoFrontend):$(tag) ./frontend
        docker push $(dockerHubUsername)/$(imageRepoFrontend):$(tag)

        # Backend (Gateway)
        docker build -t $(dockerHubUsername)/$(imageRepoBackend):$(tag) ./backend
        docker push $(dockerHubUsername)/$(imageRepoBackend):$(tag)

        # Task Read
        docker build -t $(dockerHubUsername)/$(imageRepoTaskRead):$(tag) ./backend/task-read-service
        docker push $(dockerHubUsername)/$(imageRepoTaskRead):$(tag)

        # Task Write (STATEFUL)
        docker build -t $(dockerHubUsername)/$(imageRepoTaskWrite):$(tag) ./backend/task-write-service
        docker push $(dockerHubUsername)/$(imageRepoTaskWrite):$(tag)
      displayName: 'Build & Push All Microservices'

# -----------------------------------------------------------
# STAGE 3: Deploy to Local Minikube (Corrected Schema)
# -----------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy to Minikube'
  dependsOn: Docker
  condition: succeeded()
  jobs:
  - job: LocalDeploy
    steps:
    - bash: |
        export KUBECONFIG=$HOME/.kube/config
        
        echo "Starting Helm Upgrade for Focus-Flow Build $(tag)..."
        
        # We match your FLAT values.yaml structure exactly
        helm upgrade --install focus-flow helm/focus-flow \
          --namespace focus-flow \
          --create-namespace \
          --set frontend.image=$(dockerHubUsername)/$(imageRepoFrontend) \
          --set frontend.tag=$(tag) \
          --set backend.image=$(dockerHubUsername)/$(imageRepoBackend) \
          --set backend.tag=$(tag) \
          --set taskRead.image=$(dockerHubUsername)/$(imageRepoTaskRead) \
          --set taskRead.tag=$(tag) \
          --set taskWrite.image=$(dockerHubUsername)/$(imageRepoTaskWrite) \
          --set taskWrite.tag=$(tag) \
          --wait --timeout 5m
      displayName: 'Final Helm Deploy'